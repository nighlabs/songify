version: 2
updates:
  # Go backend dependencies
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(go):"
    groups:
      go-all:
        patterns:
          - "*"
      # Security updates ignore version-update groups unless grouped explicitly
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(npm):"
    groups:
      npm-all:
        patterns:
          - "*"
      # Security updates ignore version-update groups unless grouped explicitly
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-plugin-react-hooks@7.x only supports eslint <=9
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(actions):"
    groups:
      actions-all:
        patterns:
          - "*"
      # Security updates ignore version-update groups unless grouped explicitly
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker):"
    groups:
      docker-backend:
        patterns:
          - "*"
      # Security updates ignore version-update groups unless grouped explicitly
      docker-backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker):"
    groups:
      docker-frontend:
        patterns:
          - "*"
      # Security updates ignore version-update groups unless grouped explicitly
      docker-frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
